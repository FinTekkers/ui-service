name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: svelte-kit sync (generates .svelte-kit/tsconfig.json that root tsconfig extends)
        run: npx svelte-kit sync

      - name: vitest
        run: npx vitest run --reporter=verbose

  downgrade-detector:
    name: downgrade-detector (fix-upstream-first)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run downgrade-detector against base branch
        run: python3 .github/scripts/check-downgrades.py --base "origin/${{ github.base_ref }}"
